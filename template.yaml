AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AWS Backup Verifier - initial SAM application scaffold

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 15
    MemorySize: 128

Parameters:
  BackupBucketName:
    Type: String
    Description: Existing S3 bucket that the verifier is allowed to inspect

Resources:
  BackupVerifierFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Description: Validate existence, size, and age of S3 backup objects
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${BackupBucketName}/*'
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${BackupBucketName}'

Outputs:
  BackupVerifierFunctionArn:
    Description: ARN of the verifier Lambda function
    Value: !GetAtt BackupVerifierFunction.Arn
